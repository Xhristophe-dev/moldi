<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1E1F24">
<title>Página não encontrada · Moldi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<script>
try{var t=localStorage.getItem('estudofacil.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
:root{--bg:#1E1F24;--card:#282A31;--tx:#F3F1EE;--mut:#B9BBC6;--hi:#4169E1;--soft:#2E3248;--bd:#3A3D4A}
:root[data-theme="light"]{--bg:#F8F3EB;--card:#FFFDF9;--tx:#2D2723;--mut:#6B5F55;--soft:#F1E9DC;--bd:#E6DCCB}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F8F3EB;--card:#FFFDF9;--tx:#2D2723;--mut:#6B5F55;--soft:#F1E9DC;--bd:#E6DCCB}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
main{width:100%;max-width:520px;text-align:center}
/* ESPAÇO DA IMAGEM:*/
.art{position:relative;width:min(320px,72vw);aspect-ratio:1;margin:0 auto 4px;isolation:isolate}
.art::before{content:"";position:absolute;inset:10% 2% 0;z-index:-1;background:var(--soft);border-radius:58% 42% 55% 45%/48% 56% 44% 52%}
.art img{display:block;width:100%;height:100%;object-fit:contain}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:110px;font-weight:800;color:var(--hi)}
.code{margin:0;font-size:clamp(64px,18vw,104px);line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--hi)}
h1{margin:6px 0 8px;font-size:clamp(22px,5.5vw,28px);line-height:1.25}
p{margin:0 auto 22px;max-width:420px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:99px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid transparent}
.btn.p{background:var(--hi);color:#fff}
.btn.s{background:none;color:var(--tx);border-color:var(--bd)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
footer{margin-top:30px;font-size:13px}footer a{color:var(--mut);font-weight:600}
@media(prefers-reduced-motion:no-preference){.art img{animation:flt 5s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-8px)}}}
</style>
</head>
<body>
<main>
<div class="art">
<img id="art" alt="Personagem amarelo sentado em almofadas, confuso, segurando um mapa de cabeça para baixo, com um ponto de interrogação flutuando acima da cabeça" width="320" height="320" decoding="async">
<div class="ph" id="ph" role="img" aria-label="Espaço reservado para a ilustração da página 404" hidden>?</div>
</div>
<p class="code" aria-hidden="true">404</p>
<h1>Essa página escapou da massa</h1>
<p>Não encontramos o endereço que você abriu. Ele pode ter sido digitado errado ou a página mudou de lugar.</p>
<div class="row">
<a class="btn p" id="home" href="/">Voltar ao início</a>
<button class="btn s" type="button" onclick="history.length>1?history.back():location.assign(document.getElementById('home').href)">Voltar uma página</button>
</div>
<footer><a id="priv" href="/privacidade.html">Política de privacidade</a></footer>
</main>
<script>
(function(){
var REPO='PRJT-PE',direct=location.protocol==='file:'||/\/404\.html$/.test(location.pathname),
base=direct?'':(/\.github\.io$/.test(location.hostname)&&REPO?'/'+REPO+'/':'/'),
home=document.getElementById('home'),priv=document.getElementById('priv');
home.href=base?base:(location.protocol==='file:'?'index.html':'./');priv.href=base+'privacidade.html';
var img=document.getElementById('art'),tries=['img/404.webp','img/404.png','img/404.jpg','img/404.jpeg','img/404.avif','img/404.svg','404.webp','404.png'],i=0;
function next(){if(i<tries.length){img.src=base+tries[i++]}else{img.hidden=true;document.getElementById('ph').hidden=false}}
img.onerror=next;next();
})();
</script>
</body>
</html>
